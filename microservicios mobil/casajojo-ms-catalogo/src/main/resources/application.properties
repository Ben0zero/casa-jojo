spring.application.name=ms-catalogo
server.port=8082


# --- CONFIGURACION ORACLE CLOUD ( credenciales por variable de entorno ) ---
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_SERVICE:clases_high}?TNS_ADMIN=${TNS_ADMIN}
spring.datasource.username=${ORACLE_USERNAME:ADMIN}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# CONFIGURACIÓN CRÍTICA: Limitar el Pool para el Free Tier de Oracle
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# --- Secreto JWT (A7): se lee de la variable de entorno JWT_SECRET ---
# Debe ser el MISMO en todos los microservicios y tener al menos 32 caracteres.
# Sin valor por defecto: si falta, el servicio no arranca.
jwt.secret=${JWT_SECRET}

# --- CORS (M1): origenes permitidos para la web, separados por coma ---
casajojo.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
