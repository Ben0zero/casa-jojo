spring.application.name=ms-auth

server.port=8081


# --- CONFIGURACION ORACLE CLOUD ( credenciales por variable de entorno ) ---
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_SERVICE:clases_high}?TNS_ADMIN=${TNS_ADMIN}
spring.datasource.username=${ORACLE_USERNAME:ADMIN}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.flyway.baseline-on-migrate=true
# Forzar a Flyway a usar la misma ruta de la Wallet
spring.flyway.url=jdbc:oracle:thin:@${ORACLE_SERVICE:clases_high}?TNS_ADMIN=${TNS_ADMIN}
spring.flyway.user=${ORACLE_USERNAME:ADMIN}
spring.flyway.password=${ORACLE_PASSWORD}

# CONFIGURACIÓN CRÍTICA: Limitar el Pool para el Free Tier de Oracle
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# --- Secreto JWT (A7): se lee de la variable de entorno JWT_SECRET ---
# Debe ser el MISMO en todos los microservicios y tener al menos 32 caracteres.
# Sin valor por defecto: si falta, el servicio no arranca.
jwt.secret=${JWT_SECRET}

# --- CORS (M1): origenes permitidos para la web, separados por coma ---
casajojo.cors.origenes=${CORS_ORIGENES:http://localhost:5173}

# --- EFT: recuperación de contraseña por correo ---
# Si SMTP_HOST está vacío, el servicio trabaja en modo "log": escribe el código en la
# consola (solo para la demo). Las credenciales SMTP se leen del .env, nunca del repo.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
casajojo.correo.remitente=${SMTP_FROM:no-responder@casajojo.cl}
# Minutos de vigencia del código de un solo uso.
casajojo.recuperacion.minutos=15
